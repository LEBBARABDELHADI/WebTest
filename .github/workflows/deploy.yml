name: Deploy React Blocs to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/react-blocks-simulation-FxGEl
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-blocks/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-blocks

      - name: Build
        run: npm run build
        working-directory: react-blocks

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./react-blocks/dist
