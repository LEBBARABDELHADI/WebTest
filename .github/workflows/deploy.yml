name: Deploy React Blocs to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/react-blocks-simulation-FxGEl
    # Les enregistrements de l'app (données JSON, images) ne changent pas le
    # code : inutile de reconstruire et republier le site pour eux.
    paths-ignore:
      - 'react-blocks/src/data/**'
  workflow_dispatch:

# Une seule publication à la fois : si une nouvelle arrive, l'ancienne est
# annulée (deux publications simultanées sur gh-pages peuvent échouer).
concurrency:
  group: publication-gh-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-blocks/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-blocks

      - name: Build
        run: npm run build
        working-directory: react-blocks

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./react-blocks/dist
