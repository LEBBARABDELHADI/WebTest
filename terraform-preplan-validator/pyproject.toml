[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraform-preplan-validator"
version = "1.0.0"
description = "Catch Terraform/AWS errors before terraform plan: orchestrates terraform validate, TFLint, Checkov and AWS coherence checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # standard library only; engines are external tools (terraform/tofu, tflint, checkov, aws cli)

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tfpv = "tfpv.cli:main"

[tool.setuptools.packages.find]
include = ["tfpv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs terraform, tflint (+ AWS ruleset) and checkov installed"]
